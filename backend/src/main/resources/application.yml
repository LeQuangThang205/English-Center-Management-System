server:
  port: 8080

spring:
  application:
    name: english-center

  datasource:
    url: jdbc:mysql://localhost:3306/english_center_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: thang1025
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: "english-center-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-2026"
    expiration: 86400000
  ai:
    base-url: "${AI_BASE_URL:https://api.openai.com/v1}"
    model: "${AI_MODEL:gpt-4o-mini}"
    api-key: "${AI_API_KEY:}"
    timeout-ms: 30000
    max-context-chars: 6000
    max-output-tokens: 500
